# golangci-lint configuration (schema version 2).
# Docs: https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      # Writing to an io.Writer whose failure is terminal is handled by the
      # caller; checking every fmt.Fprint return is noise. Errors from files,
      # exec and the watchdog are still checked.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    govet:
      enable-all: true
      disable:
        - fieldalignment
  exclusions:
    rules:
      # Test helpers frequently ignore returns of prints and cleanup.
      - path: _test\.go
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
